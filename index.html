<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fake Call</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { background:#0a0a0a; color:#f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
  button { font-family: inherit; font-size: 100%; line-height: 1.15; margin: 0; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; box-sizing: border-box; }
  button, input { box-sizing: border-box; }
  @keyframes fc-shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .fc-shake { animation: fc-shake 0.5s ease-in-out infinite; }
  input::placeholder { color: rgba(163,163,163,0.45); }
</style>
</head>
<body>
<div id="root" class="min-h-screen w-full flex flex-col lg:flex-row items-center justify-center gap-8 p-6"></div>

<script>
const PID_KEY = 'fc_pid';

const $ = (sel, root=document) => root.querySelector(sel);
const h = (tag, attrs={}, ...children) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k,'');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
};

const SVG = {
  phone: (cls='w-7 h-7') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
  phoneOff: (cls='w-7 h-7') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>`,
  mic: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`,
  keypad: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="white"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>`,
  speaker: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`,
  addUser: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`,
  pauseCall: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="white"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`,
  facetime: () => `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,
  refresh: () => `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
};

const NIGHT_BG = `background:
  radial-gradient(ellipse at 20% 80%, rgba(120,80,255,0.18) 0%, transparent 55%),
  radial-gradient(ellipse at 80% 20%, rgba(50,120,255,0.15) 0%, transparent 50%),
  radial-gradient(ellipse at 60% 60%, rgba(255,100,80,0.08) 0%, transparent 45%),
  linear-gradient(170deg,#0d1b2a 0%,#1a1a3e 35%,#0a0a18 70%,#000510 100%);`;

const STARS_BG = `background-image:
  radial-gradient(1px 1px at 15% 12%, rgba(255,255,255,0.7) 0%, transparent 100%),
  radial-gradient(1px 1px at 72% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
  radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
  radial-gradient(1px 1px at 88% 25%, rgba(255,255,255,0.4) 0%, transparent 100%),
  radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
  radial-gradient(1.5px 1.5px at 60% 15%, rgba(255,255,255,0.65) 0%, transparent 100%),
  radial-gradient(1px 1px at 5% 28%, rgba(255,255,255,0.4) 0%, transparent 100%),
  radial-gradient(1px 1px at 93% 40%, rgba(255,255,255,0.35) 0%, transparent 100%),
  radial-gradient(1px 1px at 50% 5%, rgba(255,255,255,0.55) 0%, transparent 100%),
  radial-gradient(1px 1px at 33% 10%, rgba(255,255,255,0.4) 0%, transparent 100%);
pointer-events:none;`;

const state = {
  mode: 'opóźnienie',
  screen: 'start',
  callerName: '',
  duration: 10,
  countdown: 0,
  paused: false,
  callSeconds: 0,
  participantId: Number(localStorage.getItem(PID_KEY) || '1'),
  clickCount: 0,
  rejectedCount: 0,
  fakeCallAttempts: 0,
  tStart: 0, tSetupSaved: 0, tFirstFakeClick: 0,
  tFakeClick: 0, tIncoming: 0, tAnswer: 0, tEnd: 0,
};

let countdownTimer = null, callTimer = null, clockTimer = null;

function setScreen(s){ state.screen = s; render(); }
function trackClick(){ state.clickCount++; }

function resetTrial(){
  state.callerName = '';
  state.duration = 10;
  state.countdown = 0;
  state.paused = false;
  state.callSeconds = 0;
  state.clickCount = 0;
  state.rejectedCount = 0;
  state.fakeCallAttempts = 0;
  state.tStart = state.tSetupSaved = state.tFirstFakeClick = 0;
  state.tFakeClick = state.tIncoming = state.tAnswer = state.tEnd = 0;
}

function resetAll(){
  if (!confirm('Spowoduje to zresetowanie numeru uczestnika i całego stanu. Kontynuować?')) return;
  localStorage.removeItem(PID_KEY);
  state.participantId = 1;
  resetTrial();
  setScreen('start');
}

function setMode(m){
  if (state.screen !== 'start') return;
  state.mode = m;
  render();
}

function startExperiment(){
  trackClick();
  resetTrial();
  state.clickCount = 1;
  state.tStart = performance.now();
  setScreen('setup');
}

function saveSetup(){
  trackClick();
  state.tSetupSaved = performance.now();
  setScreen('lock');
}

function startFakeCall(){
  trackClick();
  state.fakeCallAttempts++;
  state.tFakeClick = performance.now();
  if (!state.tFirstFakeClick) state.tFirstFakeClick = state.tFakeClick;

  if (state.mode === 'instant'){
    state.tIncoming = performance.now();
    setScreen('incoming');
    return;
  }
  state.countdown = state.duration;
  state.paused = false;
  setScreen('countdown');
  countdownTimer && clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    if (state.paused) return;
    state.countdown--;
    if (state.countdown <= 0){
      clearInterval(countdownTimer); countdownTimer = null;
      state.tIncoming = performance.now();
      setScreen('incoming');
    } else render();
  }, 1000);
}

function togglePause(){
  trackClick();
  state.paused = !state.paused;
  render();
}

function answer(){
  trackClick();
  state.tAnswer = performance.now();
  state.callSeconds = 0;
  setScreen('call');
  callTimer && clearInterval(callTimer);
  callTimer = setInterval(()=>{ state.callSeconds++; render(); }, 1000);
}

function reject(){
  trackClick();
  state.rejectedCount++;
  setScreen('lock');
}

function endCall(){
  trackClick();
  state.tEnd = performance.now();
  callTimer && clearInterval(callTimer); callTimer = null;

  const answerTime   = (state.tAnswer - state.tIncoming)/1000;
  const totalTime    = (state.tEnd - state.tFakeClick)/1000;
  const setupTime    = (state.tSetupSaved && state.tStart) ? (state.tSetupSaved - state.tStart)/1000 : 0;
  const lockToFake   = (state.tFirstFakeClick && state.tSetupSaved) ? (state.tFirstFakeClick - state.tSetupSaved)/1000 : 0;
  const sessionTotal = state.tStart ? (state.tEnd - state.tStart)/1000 : 0;
  const condition    = state.mode === 'instant' ? 'instant' : (state.duration+'s');
  const tsIso        = new Date().toISOString();

  const esc = (v)=>{
    const s = String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };

  const headers = [
    'ID_uczestnika','tryb','imie_dzwoniacego','liczba_klikniec','proby_fake_call','liczba_odrzucen',
    'czas_konfiguracji_s','czas_do_pierwszego_klikniecia_s',
    'czas_odpowiedzi_s','laczny_czas_fake_call_s','laczny_czas_sesji_s','znacznik_czasu'
  ];
  const row = [
    state.participantId, state.mode, state.callerName||'',
    state.clickCount, state.fakeCallAttempts, state.rejectedCount,
    setupTime.toFixed(3), lockToFake.toFixed(3),
    answerTime.toFixed(3), totalTime.toFixed(3), sessionTotal.toFixed(3), tsIso
  ];

  const csv = headers.join(',')+'\n'+row.map(esc).join(',')+'\n';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `p${state.participantId}_${state.mode}_${condition}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const next = state.participantId + 1;
  state.participantId = next;
  localStorage.setItem(PID_KEY, String(next));
  resetTrial();
  setScreen('start');
}

function fmtTime(d){
  return d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Warsaw'});
}
function fmtDate(d){
  return d.toLocaleDateString('pl-PL',{month:'long',day:'numeric',weekday:'long',timeZone:'Europe/Warsaw'});
}

/* ── Screens ── */

function StartScreen(){
  return h('div',{class:'absolute inset-0 flex flex-col items-center justify-center px-8 text-center', style:'background:linear-gradient(180deg,#1a1a1a,#000)'},
    h('h2',{class:'text-white text-xl font-semibold mb-2'},'Fake Call'),
    h('p',{class:'text-neutral-400 text-sm mb-2'},'Naciśnij przycisk, aby rozpocząć test.'),
    h('p',{class:'text-neutral-500 text-xs mb-8'}, 'Tryb: ' + (state.mode==='instant'?'Natychmiastowy':'Opóźnienie')),
    h('button',{class:'px-8 py-3 rounded-full bg-white text-black font-semibold text-sm active:scale-95 transition', onclick:startExperiment},'Rozpocznij eksperyment')
  );
}

function SetupScreen(){
  const input = h('input',{
    value: state.callerName,
    placeholder: 'np. Mama',
    class: 'w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white text-sm mb-6 outline-none focus:border-neutral-600',
    oninput: (e)=>{ state.callerName = e.target.value; }
  });
  const durBtn = (d)=> h('button',{
    class:`flex-1 py-3 rounded-xl text-sm font-medium border ${state.duration===d?'bg-blue-600 text-white border-blue-600':'bg-neutral-900 text-neutral-300 border-neutral-800'}`,
    onclick:()=>{ state.duration=d; render(); }
  }, d+' s');

  const children = [
    h('h2',{class:'text-white text-2xl font-bold mb-6 text-center'},'Ustawienia'),
    h('label',{class:'text-neutral-400 text-xs mb-2'},'Imię dzwoniącego'),
    input,
  ];
  if (state.mode !== 'instant'){
    children.push(
      h('label',{class:'text-neutral-400 text-xs mb-2'},'Opóźnienie'),
      h('div',{class:'flex gap-2 mb-8'}, durBtn(10), durBtn(30))
    );
  } else {
    children.push(
      h('div',{class:'mb-8 text-xs text-neutral-500 leading-relaxed'},'Tryb natychmiastowy: naciśnięcie przycisku Fake Call spowoduje natychmiastowe połączenie.')
    );
  }
  children.push(
    h('button',{class:'mt-auto mb-8 w-full py-3 rounded-xl bg-white text-black font-semibold text-sm active:scale-95', onclick:saveSetup},'Zapisz ustawienia')
  );
  return h('div',{class:'absolute inset-0 bg-neutral-950 pt-14 px-6 flex flex-col'}, ...children);
}

function LockScreen(){
  const isCounting = state.screen === 'countdown';
  const progress   = isCounting ? ((state.duration - state.countdown)/state.duration) : 0;
  const C          = 2 * Math.PI * 36;
  const now        = new Date();

  const playSVG = `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>`;

  const btn = isCounting
    ? h('button',{
        class:'relative w-20 h-20 rounded-full bg-red-600 shadow-lg flex items-center justify-center active:scale-95',
        onclick: togglePause,
        html:`
          <svg class="absolute inset-0 -rotate-90" viewBox="0 0 80 80">
            <circle cx="40" cy="40" r="36" stroke="rgba(255,255,255,0.25)" stroke-width="4" fill="none"/>
            <circle cx="40" cy="40" r="36" stroke="white" stroke-width="4" fill="none"
              stroke-dasharray="${C}" stroke-dashoffset="${C*progress}" stroke-linecap="round"
              style="transition:stroke-dashoffset 1s linear"/>
          </svg>
          <span class="relative">${state.paused ? playSVG : `<span class="text-white text-2xl font-bold">${state.countdown}</span>`}</span>`
      })
    : h('button',{
        class:'w-20 h-20 rounded-full bg-red-600 shadow-lg flex items-center justify-center active:scale-95',
        onclick: startFakeCall,
        html:'<span class="text-white text-xs font-semibold leading-tight text-center">Fake<br/>Call</span>'
      });

  return h('div',{class:'absolute inset-0 flex flex-col items-center pt-16', style: NIGHT_BG},
    h('div',{class:'absolute inset-0', style: STARS_BG}),
    h('div',{class:'absolute bottom-0 left-0 right-0', style:'height:38%;background:linear-gradient(0deg,rgba(60,30,120,0.22) 0%,transparent 100%);pointer-events:none;'}),
    h('div',{class:'text-neutral-300 text-sm mt-4 relative'}, fmtDate(now)),
    h('div',{class:'text-white text-7xl font-light tracking-tight mt-2 relative'}, fmtTime(now)),
    h('div',{class:'absolute bottom-10 right-6'}, btn),
    h('div',{class:'absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/60 rounded-full'})
  );
}

function IncomingScreen(){
  const col = (label, color, onclick, svg, ariaLabel) => h('div',{class:'flex flex-col items-center gap-2'},
    h('button',{class:`w-16 h-16 rounded-full ${color} flex items-center justify-center active:scale-95 shadow-lg`, onclick, 'aria-label':ariaLabel, html: svg}),
    h('span',{class:'text-[11px] text-neutral-300'}, label)
  );
  return h('div',{class:'absolute inset-0 flex flex-col items-center pt-20 px-6 fc-shake', style:'background:linear-gradient(180deg,#2a2a2a 0%,#000 100%)'},
    h('div',{class:'text-neutral-300 text-sm'},'iPhone'),
    h('div',{class:'text-white text-4xl font-light mt-3'}, state.callerName || 'Dzwoniący'),
    h('div',{class:'text-neutral-400 text-base mt-2'},'Telefon komórkowy'),
    h('div',{class:'absolute bottom-12 left-0 right-0 grid grid-cols-2 px-12 place-items-center'},
      col('Odrzuć','bg-red-600', reject, SVG.phoneOff('w-7 h-7'),'Odrzuć'),
      col('Odbierz','bg-green-500', answer, SVG.phone('w-7 h-7'),'Odbierz')
    )
  );
}

function CallScreen(){
  const m = String(Math.floor(state.callSeconds/60)).padStart(2,'0');
  const s = String(state.callSeconds%60).padStart(2,'0');
  const iconBtn = (label, svg) => h('div',{class:'flex flex-col items-center gap-2 opacity-90'},
    h('div',{class:'w-14 h-14 rounded-full bg-white/15 backdrop-blur flex items-center justify-center', html: svg}),
    h('span',{class:'text-white text-[11px]'}, label)
  );
  return h('div',{class:'absolute inset-0 flex flex-col items-center pt-20 px-6', style:'background:linear-gradient(180deg,#1f1f1f 0%,#000 100%)'},
    h('div',{class:'text-white text-3xl font-light'}, state.callerName || 'Dzwoniący'),
    h('div',{class:'text-neutral-300 text-sm mt-2 tabular-nums'}, `${m}:${s}`),
    h('div',{class:'absolute bottom-32 left-0 right-0 px-8 grid grid-cols-3 gap-y-6'},
      iconBtn('Wycisz', SVG.mic()), iconBtn('Klawiatura', SVG.keypad()), iconBtn('Głośnik', SVG.speaker()),
      iconBtn('Dodaj', SVG.addUser()), iconBtn('Wstrzymaj', SVG.pauseCall()), iconBtn('FaceTime', SVG.facetime())
    ),
    h('button',{class:'absolute bottom-10 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full bg-red-600 flex items-center justify-center active:scale-95 shadow-lg', onclick:endCall, 'aria-label':'Zakończ połączenie', html: SVG.phoneOff('w-7 h-7')})
  );
}

/* ── Layout ── */

function Phone(){
  let inner;
  if (state.screen === 'start')                                     inner = StartScreen();
  else if (state.screen === 'setup')                                inner = SetupScreen();
  else if (state.screen === 'lock' || state.screen === 'countdown') inner = LockScreen();
  else if (state.screen === 'incoming')                             inner = IncomingScreen();
  else if (state.screen === 'call')                                 inner = CallScreen();

  return h('div',{class:'relative'},
    h('div',{class:'relative w-[340px] h-[700px] rounded-[55px] bg-neutral-950 border-[3px] border-neutral-800 shadow-[0_0_60px_rgba(0,0,0,0.8)] p-[10px]'},
      h('div',{class:'absolute -left-[3px] top-28 w-[3px] h-8 bg-neutral-700 rounded-l'}),
      h('div',{class:'absolute -left-[3px] top-44 w-[3px] h-14 bg-neutral-700 rounded-l'}),
      h('div',{class:'absolute -left-[3px] top-64 w-[3px] h-14 bg-neutral-700 rounded-l'}),
      h('div',{class:'absolute -right-[3px] top-40 w-[3px] h-20 bg-neutral-700 rounded-r'}),
      h('div',{class:'relative w-full h-full rounded-[45px] overflow-hidden bg-black'},
        h('div',{class:'absolute top-2 left-1/2 -translate-x-1/2 w-28 h-7 bg-black rounded-full z-30'}),
        inner
      )
    )
  );
}

function ModeToggle(){
  const locked = state.screen !== 'start';
  const btn = (m, label) => h('button',{
    class:`flex-1 py-2.5 rounded-md text-sm font-medium transition ${state.mode===m?'bg-blue-600 text-white':'bg-neutral-900 text-neutral-300 hover:bg-neutral-800'} ${locked?'opacity-50 cursor-not-allowed':''}`,
    onclick: ()=> setMode(m),
    disabled: locked
  }, label);
  return h('div',{class:'rounded-lg bg-neutral-950 border border-neutral-800 p-4 space-y-2'},
    h('div',{class:'text-neutral-400 text-xs'},'Tryb prototypu'),
    h('div',{class:'flex gap-2'}, btn('opóźnienie','Opóźnienie'), btn('instant','Natychmiastowy')),
    h('div',{class:'text-[11px] text-neutral-500'}, 'Można zmienić tylko przed rozpoczęciem eksperymentu')
  );
}

function Sidebar(){
  const condLabel = state.mode === 'instant' ? 'instant' : (state.duration+'s');
  const row = (k,v)=> h('div',{class:'flex justify-between'}, h('span',{class:'text-neutral-400'},k), h('span',{},String(v)));
  return h('aside',{class:'w-full lg:w-72 space-y-3 text-sm'},
    h('h1',{class:'text-xl font-semibold'},'Fake Call'),
    ModeToggle(),
    h('div',{class:'rounded-lg bg-neutral-900 border border-neutral-800 p-4 space-y-2'},
      row('ID uczestnika', state.participantId),
      row('Bieżący ekran', state.screen),
      row('Warunek', condLabel),
      row('Dzwoniący', state.callerName || '-'),
      row('Liczba kliknięć', state.clickCount),
      row('Próby Fake Call', state.fakeCallAttempts),
      row('Liczba odrzuceń', state.rejectedCount)
    ),
    h('button',{
      class:'w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 text-xs',
      onclick: resetAll,
      html: SVG.refresh() + '<span class="ml-1">Zresetuj licznik uczestników</span>'
    }),
    h('p',{class:'text-xs text-neutral-500 leading-relaxed'},'Po zakończeniu połączenia plik CSV zostanie automatycznie pobrany.')
  );
}

function render(){
  const active   = document.activeElement;
  const focusTag = active && active.tagName;
  const selStart = active && active.selectionStart;

  const root = $('#root');
  root.innerHTML = '';
  root.append(Sidebar(), Phone());

  if (focusTag === 'INPUT'){
    const inp = root.querySelector('input');
    if (inp){ inp.focus(); try{ inp.setSelectionRange(selStart, selStart);}catch(e){} }
  }
}

clockTimer = setInterval(()=>{ if(state.screen==='lock'||state.screen==='countdown') render(); }, 1000);
render();
</script>
</body>
